
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Running Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111;font-family:Arial}
canvas{display:block}
#hud{position:absolute;top:15px;left:15px;color:white;font-size:22px;z-index:2}
#help{position:absolute;bottom:25px;width:100%;text-align:center;color:white;z-index:2}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0009;color:white;z-index:3;gap:20px}
button{padding:15px 35px;border:0;border-radius:12px;background:#16c784;color:#fff;font-size:20px}
</style>
</head>
<body>
<div id="hud">Score: <span id="score">0</span></div>
<div id="start">
<h1>3D RUNNER</h1>
<button onclick="startGame()">START GAME</button>
</div>
<div id="help">← Left &nbsp; | &nbsp; Jump ↑ &nbsp; | &nbsp; Right →</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,20,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
camera.position.set(0,5,10);
camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);scene.add(light);
const road=new THREE.Mesh(new THREE.BoxGeometry(9,.2,120),new THREE.MeshStandardMaterial({color:0x333333}));
road.position.set(0,-.1,-35);scene.add(road);
const texture = new THREE.TextureLoader().load('character.png');

const player = new THREE.Mesh(
  new THREE.PlaneGeometry(1.6, 2.2),
  new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    side: THREE.DoubleSide
  })
);
player.position.set(0,1,3);scene.add(player);
const ground=new THREE.Mesh(new THREE.BoxGeometry(200,.3,200),new THREE.MeshStandardMaterial({color:0x238b45}));
ground.position.set(0,-.3,-30);scene.add(ground);
const obstacles=[];
const coins=[];
for(let i=0;i<12;i++){
let o=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1),new THREE.MeshStandardMaterial({color:0xff8800}));
o.position.set([-3,0,3][i%3],.75,-i*9-10);scene.add(o);obstacles.push(o);
let c=new THREE.Mesh(new THREE.TorusGeometry(.4,.12,8,16),new THREE.MeshStandardMaterial({color:0xffd700,metalness:.6}));
c.position.set([0,-3,3][i%3],1.2,-i*9-5);scene.add(c);coins.push(c);
}
let lane=1,score=0,running=false,jumping=false,vy=0;
function move(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(running&&!jumping){jumping=true;vy=.22}}
function startGame(){
score=0;lane=1;running=true;jumping=false;vy=0;
player.position.set(0,1,3);
obstacles.forEach((o,i)=>o.position.z=-i*9-10);
coins.forEach((c,i)=>c.position.z=-i*9-5);
document.getElementById('score').textContent=0;
document.getElementById('start').style.display='none';
}
addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'||e.key==='a')move(-1);
if(e.key==='ArrowRight'||e.key==='d')move(1);
if(e.key==='ArrowUp'||e.key===' ')jump();
});
let touchX=0,touchY=0;
addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
let dx=e.changedTouches[0].clientX-touchX;
let dy=e.changedTouches[0].clientY-touchY;
if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();
},{passive:true});
function animate(){
requestAnimationFrame(animate);
if(running){
player.position.x+=(lane-1)*3-player.position.x>.1?.12:(lane-1)*3-player.position.x<-.1?-.12:0;
if(jumping){player.position.y+=vy;vy-=.012;if(player.position.y<=1){player.position.y=1;jumping=false}}
obstacles.forEach(o=>{
o.position.z+=.32;
if(o.position.z>5)o.position.z=-100;
if(Math.abs(o.position.z-3)<.8&&Math.abs(o.position.x-player.position.x)<1&&!jumping){
running=false;document.querySelector('#start h1').textContent='GAME OVER';
document.querySelector('#start button').textContent='PLAY AGAIN';
document.getElementById('start').style.display='flex';
}
});
coins.forEach(c=>{
c.position.z+=.32;c.rotation.y+=.06;
if(c.position.z>5)c.position.z=-100;
if(!c.userData.got&&Math.abs(c.position.z-3)<1&&Math.abs(c.position.x-player.position.x)<1){
c.userData.got=true;c.visible=false;score+=10;
document.getElementById('score').textContent=score;
}
if(c.position.z>4){c.userData.got=false;c.visible=true}
});
}
renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
